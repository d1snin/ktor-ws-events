name: Run End-to-End tests

on:
  push

jobs:
  e2e_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run End-to-End tests
        run: ./gradlew e2e:jvmTest